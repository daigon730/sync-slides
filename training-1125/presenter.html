<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>発表者コントロール — 同期スライド</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main class="presenter">
  <h2>発表者コントロール</h2>

  <div class="card">
    <div class="row">
      <label>合言葉 <input type="password" id="keyInput" placeholder="Apps Scriptに設定した PRESENTER_KEY"></label>
      <span class="small">この画面は参加者に見せないでください。</span>
    </div>
    <div class="row">
      <button id="prevBtn">← 戻る</button>
      <button id="nextBtn" class="primary">進む →</button>
      <span id="pos"></span>
      <span id="msg" class="small"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="cur-title" id="curTitle"></div>
    <details class="jump-titles">
      <summary>タイトルで選ぶ</summary>
      <div class="jump-list" id="jumpList"></div>
    </details>
  </div>

  <div class="card">
    <div class="row sw">
      <span class="sw-time" id="swTime">00:00</span>
      <button id="swToggle">スタート</button>
      <button id="swReset">リセット</button>
      <span class="small">研修全体の経過時間</span>
    </div>
  </div>

  <div class="card">
    <h2>発表者メモ <span class="guide" id="guide"></span></h2>
    <div class="note" id="note"></div>
    <div class="next-line" id="nextLine"></div>
  </div>

  <div class="preview" id="preview"></div>

  <div class="card">
    <h2>参加者用QRコード</h2>
    <div id="qrcode"></div>
    <div class="small" id="audienceUrl"></div>
    <div class="small">参加者はこのQRコードを読み取ると、追随表示のスライドが開きます。</div>
  </div>
</main>

<script src="config.js"></script>
<script src="slides.js"></script>
<script src="sync.js"></script>
<script>
const room = roomFromURL();
let current = 0;
const keyInput = document.getElementById("keyInput");
keyInput.value = sessionStorage.getItem("presenterKey") || "";
keyInput.onchange = () => sessionStorage.setItem("presenterKey", keyInput.value);

const msg = document.getElementById("msg");
function showMsg(text, ok) {
  msg.textContent = text;
  msg.className = "small " + (ok ? "ok" : "error");
}

function render() {
  document.getElementById("preview").innerHTML = slideHTML(current);
  document.getElementById("note").textContent = SLIDES[current].note || "";
  document.getElementById("pos").textContent = `${current + 1} / ${SLIDES.length} 枚目`;
  document.getElementById("curTitle").textContent =
    `${current + 1}. ${SLIDES[current].title}`;
  const m = (SLIDES[current].note || "").match(/\d+〜\d+分/);
  document.getElementById("guide").textContent = m ? `（目安 ${m[0]}）` : "";
  document.getElementById("nextLine").textContent =
    current + 1 < SLIDES.length
      ? `次：${current + 2}. ${SLIDES[current + 1].title}`
      : "次：最終スライドです";
  document.querySelectorAll("#chips button").forEach((b, i) =>
    b.classList.toggle("active", i === current));
  document.querySelectorAll(".jump-list button").forEach((b, i) =>
    b.classList.toggle("active", i === current));
  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("nextBtn").disabled = current === SLIDES.length - 1;
}

async function go(i) {
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  render();
  if (!Sync.configured()) {
    showMsg("同期は設定待ちです（config.js にURLを貼ると有効になります）", false);
    return;
  }
  const key = keyInput.value.trim();
  if (!key) { showMsg("合言葉を入力してください", false); return; }
  try {
    const r = await Sync.setSlide(room, current, key);
    if (r && r.ok) showMsg("参加者へ送信済み", true);
    else showMsg("送信できませんでした: " + (r && r.error ? r.error : "不明なエラー"), false);
  } catch (e) {
    showMsg("通信に失敗しました", false);
  }
}

document.getElementById("prevBtn").onclick = () => go(current - 1);
document.getElementById("nextBtn").onclick = () => go(current + 1);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

// 番号チップとタイトル一覧
const chips = document.getElementById("chips");
const jumpList = document.getElementById("jumpList");
SLIDES.forEach((s, i) => {
  const c = document.createElement("button");
  c.textContent = `${i + 1}`;
  c.title = s.title;
  c.onclick = () => go(i);
  chips.appendChild(c);
  const b = document.createElement("button");
  b.textContent = `${i + 1}. ${s.title}`;
  b.onclick = () => go(i);
  jumpList.appendChild(b);
});

// ストップウォッチ
let swStart = null, swElapsed = 0, swTimer = null;
const swTime = document.getElementById("swTime");
const swToggle = document.getElementById("swToggle");
function swFormat(ms) {
  const sec = Math.floor(ms / 1000);
  const mm = String(Math.floor(sec / 60)).padStart(2, "0");
  const ss = String(sec % 60).padStart(2, "0");
  return `${mm}:${ss}`;
}
function swRender() {
  const now = swStart === null ? swElapsed : swElapsed + (Date.now() - swStart);
  swTime.textContent = swFormat(now);
}
swToggle.onclick = () => {
  if (swStart === null) {
    swStart = Date.now();
    swTimer = setInterval(swRender, 250);
    swToggle.textContent = "一時停止";
  } else {
    swElapsed += Date.now() - swStart;
    swStart = null;
    clearInterval(swTimer);
    swRender();
    swToggle.textContent = "再開";
  }
};
document.getElementById("swReset").onclick = () => {
  swStart = null; swElapsed = 0;
  clearInterval(swTimer);
  swRender();
  swToggle.textContent = "スタート";
};
swRender();

// 参加者URLとQRコード
const audienceUrl = location.href.replace(/presenter\.html.*$/, "index.html") +
  (room !== "main" ? `?room=${encodeURIComponent(room)}` : "");
document.getElementById("audienceUrl").textContent = audienceUrl;
try {
  new QRCode(document.getElementById("qrcode"), { text: audienceUrl, width: 180, height: 180 });
} catch (e) {
  document.getElementById("qrcode").textContent = "QRコードを生成できませんでした。上のURLを共有してください。";
}

// 起動時にサーバーの現在位置へ合わせる
(async () => {
  if (Sync.configured()) {
    try {
      const st = await Sync.getState(room);
      if (st && st.ok) { current = Math.max(0, Math.min(SLIDES.length - 1, st.slide)); }
    } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
