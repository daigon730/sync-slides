<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Kaigi 2026｜発表者用</title><style>*{box-sizing:border-box}body{background:#102b33;color:#faf4e7;font:18px sans-serif;margin:2vw}iframe{border:0;width:100%;height:67vh}button,input{font:inherit;padding:.45em}dialog{text-align:center}dialog img{width:min(65vw,55vh);display:block;margin:auto}output{display:inline-block;padding:.5em}iframe{height:48vh}aside{background:#fff8ea;color:#102b33;padding:14px 20px;border-radius:8px;margin:10px 0}aside h2{font-size:16px;margin:0;color:#006c69}aside p{white-space:pre-line;line-height:1.55;margin:6px 0}select{font:inherit;max-width:100%;padding:7px}label{display:inline-block;margin:5px 0}</style><form><label>発表者の合言葉 <input type="password" required autocomplete="off"></label> <button>同期を開始</button></form><iframe src="deck.html" title="投影プレビュー" tabindex="-1" inert></iframe><div><button id="back" disabled>戻る</button> <button id="forward" disabled>次へ</button> <button id="invite">参加用QRを表示</button> <output aria-live="polite">合言葉を入力してください</output></div><label>スライドへ移動 <select id="jump" disabled></select></label><aside hidden><h2>発表者メモ</h2><p id="note"></p></aside><dialog><h2>スマートフォンでスライドを見る</h2><img src="join.png" alt="XR Kaigi 2026 参加用QR"><p><a href="./index.html">参加者用ページ</a></p><button id="closeQr">閉じる</button></dialog><script src="../config.js"></script><script src="sync-client.js"></script><script>
const room='xr-kaigi-2026',frame=document.querySelector('iframe'),out=document.querySelector('output'),form=document.querySelector('form'),input=document.querySelector('input');let page=0,active=false,busy=false;
const slideNotes = [["生徒と先生はAIをどう使うか", "00:00–01:00　自己紹介に先立ち、今日は生徒の作品と、自分が初めてゲームを作った日の両方を持ってきた、と伝える。"], ["中村 太悟", "01:00–02:00　写真の中で生徒と何をしているかを一つ紹介。"], ["鹿児島県南さつま市の鳳凰高等学校", "02:00–03:30　学校の場所と普通科のDXハイスクールでの取り組みを紹介。"], ["学校の中の制作現場", "03:30–05:00　研修で生徒が教える側に立った場面を紹介。"], ["地元の深海魚を知ってもらうには？", "05:00–06:30　魚を教材に選んだ経緯と、なぜ遊びの形にしたのかを話す。"], ["生徒作品「XR深海魚仕分け人」", "06:30–08:00　操作の仕方を写真に沿って説明。校外に持ち出すと、目の前で初めて遊ぶ人の反応が見える。"], ["生物基礎の授業で、AIを対話役に", "08:00–10:00　実際のやり取りから一往復だけ選び、考えがどう動いたかを読む。"], ["僕自身のAIの使い方も変わった", "10:00–12:00　小中学生には問いを深める経験を大切にしたい。社会に出る高校生には、実際に使って到達点を知る経験も渡したい、という自分の考えを話す。"], ["きっかけは「自分たちで遊びたい」", "12:00–14:00　実際の作品を一つ選び、何をすると楽しいゲームなのか、遊ぶ側の目線で紹介。"], ["鹿児島銀行とのゲーム制作", "14:00–16:00　何を知ってもらいたいゲームかを伝えてから再生。再生時間を含む。"], ["授業で試したい実験を、自分で教材にする", "16:00–18:00　二例のうち一方を選び、どんな授業上の難しさから作ったのか説明。\n保温教材では、ミッションを選び、外気温・お湯の温度・保温時間を調整する画面を紹介。"], ["班別の評価アンケートを、一度に用意する", "18:00–20:00　準備側と生徒側を順に指し示す。どれを開けばいいか生徒が迷わない点も話す。"], ["複数のAIを使える学校へ", "20:00–21:00　組織での取り組みは試験段階。個人でのゲーム制作と区別して話す。"], ["答えがすぐ手に入る時代に、教員の僕は、生徒のそばで何ができる？", "21:00–22:30　問いを出したら一呼吸置く。宿題をAIに示すと解説まで返ってくる場面から考え始めた、と話す。"], ["「やってみたい」を試せる場所", "22:30–24:30　生徒に「転ぶ権利」を残すことと、人としての成長をそばで支えることを自分の言葉で。"], ["僕も、ゲームを作ってみました。", "24:30–25:30　生徒に勧めるなら自分でも試してみたいと思った理由を話す。"], ["深海で、魚を探してみてください。", "25:30–28:30　最初は魚影だけを見せる。答えを先に言わず、ライトが当たって魚の色が見える瞬間を待つ。映像または実演。"], ["ライトを向けると、魚の色が見える", "28:30–29:30　実演で見落とした人にも届くよう、同じ魚の前後を静止画で比べる。"], ["11月26日、午後から夜まで", "29:30–31:30　ゲーム制作の専門家ではない自分が、初日に確認できた範囲を説明。直前の映像が後日の版ならその旨も明示。"], ["手元で動くと、次に頼みたいことが見える", "31:30–33:00　どんな操作感にしたかったか、手を動かして説明する。"], ["作品のどこを、自分が決めたか", "33:00–34:30　魚の造形とゲームの体験づくりを分けて見せる。"], ["その日のうちに、自分で遊んで確かめられた。", "34:30–35:30　自分の想像と、実物を触ったときの感覚の違いを語る。初日の驚きを客席に戻す。"], ["作ってみたから、生徒と話せること", "35:30–37:00　生徒と先生の作品を並べ、作り手どうしとして尋ねてみたいことを一つ話す。"], ["最初に作るものは、身近なところにある", "37:00–38:00　会場の人に、自分の仕事や遊びで一つ思い浮かべてもらう。"], ["皆さんなら、明日１日で何を作ってみたいですか？", "38:00–39:00　間を置いて締める。残り時間は質疑に使う。"]];
const jump = document.getElementById('jump');
slideNotes.forEach(([title], index) => jump.add(new Option((index + 1) + '　' + title, index)));
jump.onchange = () => {
  const target = Number(jump.value);
  jump.value = String(page);
  send(target);
};
function updateNotes() {
  jump.value = String(page);
  document.getElementById('note').textContent = slideNotes[page][1];
  document.querySelector('aside').hidden = false;
}
function controls(){jump.disabled=busy||!active;back.disabled=busy||!active||page===0;forward.disabled=busy||!active||page===24;form.querySelector('button').disabled=busy}
async function send(target,starting=false){if(busy||(!active&&!starting))return;busy=true;controls();let stage='現在のページの取得';out.textContent=stage+'中…';try{if(starting){const state=await Sync.getState(room);if(!state.ok)throw Error();target=Number.isInteger(state.slide)?state.slide:0}target=Math.min(24,Math.max(0,target));stage='ページ番号の送信';out.textContent=stage+'中…';const result=await Sync.setSlide(room,target,input.value);if(!result.ok){out.textContent='送信できません。合言葉を確認してください';return}page=target;active=true;stage='プレビューの表示';frame.contentWindow.show(page);updateNotes();out.textContent=(page+1)+' / 25　参加者に送信済み';form.hidden=true}catch(error){out.textContent=stage+'で'+(error.message==='timeout'?'30秒以内に応答がありませんでした。':'エラーが発生しました。')+' もう一度お試しください。'}finally{busy=false;controls()}}
form.onsubmit=e=>{e.preventDefault();send(0,true)};back.onclick=()=>send(page-1);forward.onclick=()=>send(page+1);const dialog=document.querySelector('dialog');invite.onclick=()=>dialog.showModal();closeQr.onclick=()=>dialog.close();document.onkeydown=e=>{if(!active||dialog.open||e.target===input||e.target===jump||e.target.tagName==="BUTTON")return;if(['ArrowRight',' ','ArrowLeft'].includes(e.key)){e.preventDefault();send(page+(e.key==='ArrowLeft'?-1:1))}}
</script></html>
