<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Kaigi 2026｜発表者用</title><style>*{box-sizing:border-box}body{background:#102b33;color:#faf4e7;font:18px sans-serif;margin:2vw}iframe{border:0;width:100%;height:67vh}button,input{font:inherit;padding:.45em}dialog{text-align:center}dialog img{width:min(65vw,55vh);display:block;margin:auto}output{display:inline-block;padding:.5em}</style><form><label>発表者の合言葉 <input type="password" required autocomplete="off"></label> <button>同期を開始</button></form><iframe src="deck.html" title="投影プレビュー" tabindex="-1" inert></iframe><div><button id="back" disabled>戻る</button> <button id="forward" disabled>次へ</button> <button id="invite">参加用QRを表示</button> <output aria-live="polite">合言葉を入力してください</output></div><dialog><h2>スマートフォンでスライドを見る</h2><img src="join.png" alt="XR Kaigi 2026 参加用QR"><p><a href="./index.html">参加者用ページ</a></p><button id="closeQr">閉じる</button></dialog><script src="../config.js"></script><script src="../sync.js"></script><script>
const room='xr-kaigi-2026',frame=document.querySelector('iframe'),out=document.querySelector('output'),form=document.querySelector('form'),input=document.querySelector('input');let page=0,active=false,busy=false;
function controls(){back.disabled=busy||!active||page===0;forward.disabled=busy||!active||page===24;form.querySelector('button').disabled=busy}
async function send(target,starting=false){if(busy||(!active&&!starting))return;busy=true;controls();try{if(starting){const state=await Sync.getState(room);if(!state.ok)throw Error();target=Number.isInteger(state.slide)?state.slide:0}target=Math.min(24,Math.max(0,target));const result=await Sync.setSlide(room,target,input.value);if(!result.ok){out.textContent='送信できません。合言葉を確認してください';return}page=target;active=true;frame.contentWindow.show(page);out.textContent=(page+1)+' / 25　参加者に送信済み';form.hidden=true}catch{out.textContent='通信できません。接続を確認して再試行してください'}finally{busy=false;controls()}}
form.onsubmit=e=>{e.preventDefault();send(0,true)};back.onclick=()=>send(page-1);forward.onclick=()=>send(page+1);const dialog=document.querySelector('dialog');invite.onclick=()=>dialog.showModal();closeQr.onclick=()=>dialog.close();document.onkeydown=e=>{if(!active||dialog.open||e.target===input)return;if(['ArrowRight',' ','ArrowLeft'].includes(e.key)){e.preventDefault();send(page+(e.key==='ArrowLeft'?-1:1))}}
</script></html>
