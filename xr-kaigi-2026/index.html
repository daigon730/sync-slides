<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Kaigi 2026｜参加者用</title><style>body{margin:0;background:#102b33;color:white;font:14px sans-serif}iframe{width:100%;height:calc(100dvh - 28px);border:0;display:block}footer{text-align:center;line-height:28px}</style><iframe title="登壇スライド" src="deck.html"></iframe><footer role="status">発表中のページを確認しています</footer><script src="../config.js"></script><script src="../sync.js"></script><script>
const frame=document.querySelector('iframe'),statusText=document.querySelector('footer');
const room='xr-kaigi-2026';let pending=false;
async function refresh(){if(pending||document.hidden)return;pending=true;try{const state=await Sync.getState(room);if(!state.ok||!Number.isInteger(state.slide)||state.slide<0||state.slide>=25)throw Error();frame.contentWindow.show(state.slide);statusText.textContent='発表に追随中　'+(state.slide+1)+' / 25'}catch{statusText.textContent='接続を確認中 · 自動で再接続します'}finally{pending=false}}
frame.onload=refresh;document.addEventListener('visibilitychange',refresh);window.addEventListener('online',refresh);setInterval(refresh,5000);refresh()
</script></html>
